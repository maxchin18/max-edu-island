name: 驗證教育理念島資料

on:
  push:
    paths: ['data/**', 'tools/**', '.github/workflows/validate.yml']
  pull_request:
    paths: ['data/**', 'tools/**']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 驗證 data/site.json
        run: node tools/site.mjs validate
      - name: 確認 JS 語法
        run: |
          for f in assets/js/*.js admin/admin.js server.js tools/site.mjs; do node --check "$f"; done
